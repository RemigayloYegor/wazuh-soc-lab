<!--
  Фрагмент для C:\Program Files (x86)\ossec-agent\ossec.conf (внутри <ossec_config>).
  Подключает журнал Sysmon. После правки: Restart-Service WazuhSvc
-->
<localfile>
  <location>Microsoft-Windows-Sysmon/Operational</location>
  <log_format>eventchannel</log_format>
</localfile>

<!-- Журнал PowerShell (Script Block Logging включается через GPO) -->
<localfile>
  <location>Microsoft-Windows-PowerShell/Operational</location>
  <log_format>eventchannel</log_format>
</localfile>
