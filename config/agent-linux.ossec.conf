<!--
  Фрагмент для /var/ossec/etc/ossec.conf агента Linux (внутри <ossec_config>).
  После правки: sudo systemctl restart wazuh-agent
-->

<!-- Логи файрвола UFW: источник для детектора сканирования -->
<localfile>
  <log_format>syslog</log_format>
  <location>/var/log/ufw.log</location>
</localfile>

<!-- Алерты Python-детектора (soclab portscan -o ...) — правило 100106 -->
<localfile>
  <log_format>json</log_format>
  <location>/var/log/soclab/portscan.json</location>
</localfile>
